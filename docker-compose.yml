version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: medplum-postgres
    environment:
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: medplum
      POSTGRES_DB: medplum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medplum"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7
    container_name: medplum-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Medplum Server
  medplum-server:
    image: medplum/medplum-server:latest
    container_name: medplum-server
    ports:
      - "8103:8103"
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=medplum
      - DATABASE_USERNAME=medplum
      - DATABASE_PASSWORD=medplum
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=8103
      - BASE_URL=http://localhost:8103
      - ISSUER=http://localhost:8103
      - JWKS_URL=http://localhost:8103/.well-known/jwks.json
      - AUTHORIZE_URL=http://localhost:8103/oauth2/authorize
      - TOKEN_URL=http://localhost:8103/oauth2/token
      - USERINFO_URL=http://localhost:8103/oauth2/userinfo
      - APP_URL=http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8103/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Provider Registry Frontend
  provider-registry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: provider-registry
    ports:
      - "3001:80"
    environment:
      - VITE_MEDPLUM_BASE_URL=http://localhost:8103
    depends_on:
      medplum-server:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
