apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: provider-registry
spec:
  selector:
    app: provider-registry-frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-registry-frontend
  namespace: provider-registry
spec:
  replicas: 3  # Frontend can scale horizontally
  selector:
    matchLabels:
      app: provider-registry-frontend
  template:
    metadata:
      labels:
        app: provider-registry-frontend
    spec:
      containers:
      - name: frontend
        image: gcr.io/dti-exp1/provider-registry-frontend:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: VITE_MEDPLUM_BASE_URL
          value: "https://your-domain.com"  # Update with actual domain
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
