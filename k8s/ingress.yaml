apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: provider-registry-ingress
  namespace: provider-registry
  annotations:
    # Use GCP Load Balancer
    kubernetes.io/ingress.class: "gce"
    # Enable HTTPS redirect
    kubernetes.io/ingress.allow-http: "true"
    # For GCP managed SSL certificates (recommended)
    networking.gke.io/managed-certificates: "provider-registry-cert"
    # Backend configuration
    cloud.google.com/backend-config: '{"default": "backend-config"}'
spec:
  rules:
  # Frontend (React App)
  - host: your-frontend-domain.com  # Update with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80

  # Medplum Backend API
  - host: your-api-domain.com  # Update with your API domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: medplum-service
            port:
              number: 8103
---
# GCP Managed SSL Certificate
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: provider-registry-cert
  namespace: provider-registry
spec:
  domains:
    - your-frontend-domain.com  # Update with your frontend domain
    - your-api-domain.com       # Update with your API domain
---
# Backend Configuration for health checks
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: backend-config
  namespace: provider-registry
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /healthcheck
    port: 8103
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 60
